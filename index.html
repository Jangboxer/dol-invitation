  /* 하단 고정 링크 복사 */

  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 사진 크게 보기 */

<script>
(() => {
  const { info: I, photos: P } = window.INVITE;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const todo = (label) => `<span class="todo">${esc(label)}</span>`;
  const val = (v, label) => (v ? esc(v) : todo(label));
  const DOW = '일월화수목금토';
  const E = I.돌잔치 || {};

  const parseDate = (s) => { const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s || ''); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; };
  const parseTime = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  const fmtTime = ([h, mi]) => `${h < 12 ? '오전' : '오후'} ${h > 12 ? h - 12 : h}시${mi ? ` ${mi}분` : ''}`;
  const party = parseDate(E.날짜);
  const time = parseTime(E.시간);
  const dateTxt = party ? `${party.getFullYear()}년 ${party.getMonth() + 1}월 ${party.getDate()}일` : '';
  const dowTxt = party ? `${DOW[party.getDay()]}요일` : '';
  const timeTxt = time ? fmtTime(time) : '';

  // 사이 꾸밈 — 꽃가지(오른쪽 위), 잎가지(왼쪽 아래)
  const flower = (x, y, r, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})">${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="${-r * 0.55}" rx="${r * 0.42}" ry="${r * 0.58}" transform="rotate(${a})" fill="#f6e9e3" stroke="#e6cfc5" stroke-width="1"/>`).join('')}<circle r="${r * 0.2}" fill="#d9a7a0"/><circle r="${r * 0.08}" fill="#a86f69"/></g>`;
  const leaf = (x, y, l, rot, c) => `<ellipse cx="${x}" cy="${y}" rx="${l * 0.32}" ry="${l}" transform="rotate(${rot} ${x} ${y})" fill="${c}"/>`;
  const decoFlower = `<svg class="deco-flower" viewBox="0 0 160 190" aria-hidden="true">
    <path d="M40 0 C 60 60, 90 110, 150 185" fill="none" stroke="#7f9b88" stroke-width="2"/>
    <path d="M70 70 C 90 75, 105 90, 112 102" fill="none" stroke="#7f9b88" stroke-width="1.5"/>
    ${leaf(118, 150, 16, -40, '#9db5a3')}${leaf(98, 128, 14, 30, '#8aa794')}${leaf(132, 172, 11, -20, '#a9bfae')}${leaf(58, 58, 12, -30, '#9db5a3')}
    ${flower(36, 38, 30, 10)}${flower(26, 104, 24, -20)}${flower(112, 102, 18, 25)}</svg>`;
  const decoLeaf = `<svg class="deco-leaf" viewBox="0 0 120 140" aria-hidden="true">
    <path d="M112 136 C 80 100, 50 60, 20 8" fill="none" stroke="#8aa594" stroke-width="1.6"/>
    ${leaf(26, 22, 14, -35, '#9fb8a6')}${leaf(48, 34, 13, 55, '#8fab99')}${leaf(44, 58, 14, -40, '#9fb8a6')}${leaf(68, 66, 13, 55, '#8fab99')}${leaf(64, 92, 14, -45, '#a7beac')}${leaf(88, 98, 12, 55, '#8fab99')}</svg>`;

  const hero = `<header class="hero">
    ${P.main ? `<img class="photo" src="${P.main}" alt="${esc(I.아이.이름)} 사진">` : `<div class="photo empty">사진 폴더에 이름에 '메인'이 들어간<br>사진을 넣으면 여기에 나와요</div>`}
    ${decoFlower}
    <div class="name">${esc(I.아이.이름)}</div>
    <div class="rule"></div>
    <div class="sub">첫 번째 생일에 초대합니다</div>
    <div class="parents"><span><span>아빠</span><span>${val(I.부모.아빠, '이름')}</span></span><span><span>엄마</span><span>${val(I.부모.엄마, '이름')}</span></span></div>
    <div class="when">${party ? `${esc(dateTxt)} ${esc(dowTxt)} ` : todo('날짜')} ${timeTxt ? esc(timeTxt) : todo('시간')}</div>
    ${E.표지장소 ? `<div class="where">${esc(E.표지장소)}</div>` : ''}
    ${E.표지주소 ? `<div class="addr">${esc(E.표지주소)}</div>` : ''}
    ${decoLeaf}
  </header>`;

  // 모시는 글 — 빈 줄은 빈 문단으로
  const greet = (I.모시는글 || []).map((l) => `<p>${l ? esc(l) : ''}</p>`).join('');
  const invite = `<section class="invite"><div class="rv">
    <p class="label">Invitation</p><h2>모시는 글</h2><div class="greet">${greet}</div>
  </div></section>`;

  // 달력 — 돌잔치 날짜가 있는 달(없으면 첫 생일이 있는 달)
  const birth = parseDate(I.아이.생일);
  const base = party || (birth ? new Date(birth.getFullYear() + 1, birth.getMonth(), birth.getDate()) : new Date());
  const y = base.getFullYear(), mo = base.getMonth();
  const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
  const cls = (dw) => (dw === 0 ? ' sun' : dw === 6 ? ' sat' : '');
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<div class="day"></div>');
  for (let d = 1; d <= days; d++) {
    const pick = party && d === party.getDate();
    cells.push(`<div class="day${cls((first + d - 1) % 7)}${pick ? ' pick' : ''}"><span>${d}</span></div>`);
  }
  while (cells.length % 7) cells.push('<div class="day"></div>');
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(`<div class="row rv">${cells.slice(i, i + 7).join('')}</div>`);
  const calendar = `<section class="calendar">
    <div class="rv"><p class="label">Calendar</p>
      <p class="when">${party ? `${esc(dowTxt)} · ${esc(dateTxt)}` : todo('날짜')} · ${timeTxt ? esc(timeTxt) : todo('시간')}</p></div>
    <div class="cal"><div class="row dow rv">${[...DOW].map((d, i) => `<span class="${cls(i).trim()}">${d}</span>`).join('')}</div>${weeks.join('')}</div>
    ${party ? `<div class="count rv" aria-label="돌잔치까지 남은 시간"><div><b data-k="d">0</b><small>DAYS</small></div><div><b data-k="h">0</b><small>HOURS</small></div><div><b data-k="m">0</b><small>MINUTES</small></div><div><b data-k="s">0</b><small>SECONDS</small></div></div>` : ''}
  </section>`;

  // 갤러리 — 처음 9장, 나머지는 더보기
  const G = P.gallery || [];
  const SHOW = 9;
  const gallery = `<section class="gallery">
    <div class="rv"><h2 class="label">Gallery</h2></div>
    <div class="rv">
      ${G.length ? `<div class="grid">${G.map((g, i) => `<button type="button" class="${i >= SHOW ? 'more-item' : ''}" data-i="${i}" aria-label="사진 ${i + 1} 크게 보기"><img src="${g.t}" alt=""></button>`).join('')}</div>`
        : `<div class="grid">${'<div class="empty"></div>'.repeat(9)}</div>`}
      ${G.length > SHOW ? `<div class="more"><button type="button" aria-expanded="false">더보기 (${G.length - SHOW}장 더)</button></div>` : ''}
    </div>
  </section>`;

  // 오시는 길 — 좌표가 있으면 버튼마다 그 지도 앱의 길찾기(도착지 = 돌잔치 장소)로 바로 연다
  const q = encodeURIComponent(E.주소 || E.장소 || '');
  const lat = E.위도, lng = E.경도, hasPos = typeof lat === 'number' && typeof lng === 'number';
  const nm = encodeURIComponent(E.지도이름 || E.장소 || '');
  // 네이버 웹 길찾기 주소는 EPSG:3857 좌표를 쓴다
  const mx = hasPos ? (lng * 20037508.34 / 180).toFixed(1) : 0;
  const my = hasPos ? (Math.log(Math.tan((90 + lat) * Math.PI / 360)) / (Math.PI / 180) * 20037508.34 / 180).toFixed(1) : 0;
  const naverWeb = hasPos ? `https://map.naver.com/p/directions/-/${mx},${my},${nm},,SIMPLE_POI/-/car` : `https://map.naver.com/v5/search/${q}`;
  const naverApp = `route/car?dlat=${lat}&dlng=${lng}&dname=${nm}&appname=${encodeURIComponent(location.origin)}`;
  const go = hasPos ? {
    google: `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
    tmap: `tmap://route?goalname=${nm}&goalx=${lng}&goaly=${lat}`,
    kakao: `https://map.kakao.com/link/to/${nm},${lat},${lng}`,
  } : {
    google: `https://www.google.com/maps/search/?api=1&query=${q}`,
    tmap: `tmap://search?name=${q}`,
    kakao: `https://map.kakao.com/link/search/${q}`,
  };
  const mapQ = hasPos ? `${lat},${lng}` : q;
  const pin = (c) => `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2a4.8 4.8 0 0 0-4.8 4.8c0 3.6 4.8 8.8 4.8 8.8s4.8-5.2 4.8-8.8A4.8 4.8 0 0 0 8 1.2z" fill="${c}"/><circle cx="8" cy="6" r="1.8" fill="#fff"/></svg>`;
  const tIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3h11v2.6H9.4V14H6.6V5.6H2.5z" fill="#2d5bff"/></svg>';
  const T = I.교통 || {};
  const ways = [['자가용', T.자가용], ['대중교통', T.대중교통]].filter(([, v]) => v);
  const where = `<section class="location">
    <div class="rv"><h2 class="label">Location</h2></div>
    <div class="rv"><div class="map">${q
      ? `<iframe src="https://maps.google.com/maps?q=${mapQ}&z=16&hl=ko&output=embed" loading="lazy" title="지도" tabindex="-1"></iframe>
         <a href="${naverWeb}" target="_blank" rel="noopener" data-naver aria-label="네이버 지도 길찾기"></a><span class="badge">네이버 지도 길찾기</span>`
      : `<div class="nomap">주소를 넣으면 지도가 나와요</div>`}</div></div>
    <div class="rv"><div class="place">
      <p>${val(E.장소, '장소 이름')}</p>
      ${E.주소 ? `<button type="button" class="addr" data-copy="addr"><span>${esc(E.주소)}</span><span class="chip">복사</span></button>` : todo('주소')}
    </div></div>
    ${q ? `<div class="rv"><div class="maps">
      <a href="${go.google}" target="_blank" rel="noopener">${pin('#ea4335')}<span>구글맵</span></a>
      <a href="${go.tmap}">${tIcon}<span>T MAP</span></a>
      <a href="${naverWeb}" target="_blank" rel="noopener" data-naver>${pin('#03c75a')}<span>네이버맵</span></a>
      <a href="${go.kakao}" target="_blank" rel="noopener">${pin('#f7c600')}<span>카카오맵</span></a>
    </div></div>` : ''}
    ${ways.length ? `<div class="rv"><div class="ways">
      <div class="tabs" role="tablist">${ways.map(([k], i) => `<button type="button" role="tab" aria-selected="${i === 0}" data-w="${i}">${k}</button>`).join('')}</div>
      ${ways.map(([, v], i) => `<p class="pane" role="tabpanel" ${i ? 'hidden' : ''}>${esc(v)}</p>`).join('')}
    </div></div>` : ''}
  </section>`;

  // 정보.json "달력": false 면 달력(+남은 시간) 섹션을 뺀다
  const showCal = I.달력 !== false;
  $('#app').innerHTML = hero + invite + (showCal ? calendar : '') + gallery + where;

  // 스크롤하면 하나씩 나타나기
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' }) : null;
  document.querySelectorAll('.rv').forEach((el) => (io ? io.observe(el) : el.classList.add('in')));

  // 남은 시간
  if (party && showCal) {
    const at = new Date(party); if (time) at.setHours(time[0], time[1]);
    const box = $('.count');
    const tick = () => {
      let s = Math.max(0, Math.floor((at - Date.now()) / 1000));
      const v = { d: Math.floor(s / 86400), h: Math.floor(s / 3600) % 24, m: Math.floor(s / 60) % 60, s: s % 60 };
      for (const k in v) box.querySelector(`[data-k="${k}"]`).textContent = v[k];
    };
    tick(); setInterval(tick, 1000);
  }

  // 복사
  const toast = $('.toast');
  let tt;
  const say = (msg) => { toast.textContent = msg; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); };
  const copy = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; } catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok;
    }
  };
  document.addEventListener('click', async (e) => {
    // 네이버 지도: 휴대폰이면 앱 길찾기, 앱이 없으면 웹 길찾기
    const nv = e.target.closest('[data-naver]');
    if (nv && hasPos) {
      const ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        e.preventDefault();
        location.href = `intent://${naverApp}#Intent;scheme=nmap;package=com.nhn.android.nmap;S.browser_fallback_url=${encodeURIComponent(naverWeb)};end`;
      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        e.preventDefault();
        location.href = `nmap://${naverApp}`;
        setTimeout(() => { if (!document.hidden) location.href = naverWeb; }, 1500);
      }
      return;
    }
    const c = e.target.closest('[data-copy]');
    if (c) {
      const addr = c.dataset.copy === 'addr';
      const ok = await copy(addr ? E.주소 : location.href);
      say(ok ? (addr ? '주소를 복사했어요' : '링크를 복사했어요') : '복사하지 못했어요. 길게 눌러 직접 복사해 주세요');
      return;
    }
    const w = e.target.closest('[data-w]');
    if (w) {
      const box = w.closest('.ways');
      box.querySelectorAll('[role=tab]').forEach((t) => t.setAttribute('aria-selected', String(t === w)));
      box.querySelectorAll('.pane').forEach((p, i) => (p.hidden = i !== +w.dataset.w));
      return;
    }
    const more = e.target.closest('.more button');
    if (more) {
      const grid = $('.grid'), open = grid.classList.toggle('open');
      more.setAttribute('aria-expanded', String(open));
      more.textContent = open ? '접기' : `더보기 (${G.length - SHOW}장 더)`;
      if (!open) grid.scrollIntoView({ block: 'start' });
      return;
    }
    const tile = e.target.closest('.grid button');
    if (tile) openLb(+tile.dataset.i);
  });

  // 사진 크게 보기 — 좌우 버튼·스와이프·방향키
  const lb = $('.lb'), lbImg = $('.lb img'), lbNum = $('.lb .num');
  let cur = 0, back = null;
  const show = (i) => { cur = (i + G.length) % G.length; lbImg.src = G[cur].f; lbNum.textContent = `${cur + 1} / ${G.length}`; };
  const fab = $('.fab');
  const openLb = (i) => { back = document.activeElement; show(i); lb.hidden = false; fab.hidden = true; document.documentElement.style.overflow = 'hidden'; $('.lb .close').focus(); };
  const closeLb = () => { lb.hidden = true; fab.hidden = false; document.documentElement.style.overflow = ''; if (back) back.focus(); };
  $('.lb .prev').onclick = () => show(cur - 1);
  $('.lb .next').onclick = () => show(cur + 1);
  $('.lb .close').onclick = closeLb;
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', (e) => {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
  let sx = null;
  lb.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); sx = null; });
})();
</script>
</body>
</html>
